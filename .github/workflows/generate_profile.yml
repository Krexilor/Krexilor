name: Generate profile SVG

on:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_profile.py"
      - ".github/workflows/generate_profile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate profile SVG
        run: python scripts/generate_profile.py

      - name: Commit updated SVG
        run: |
          mkdir -p assets
          git add assets/profile.svg || true

          if git diff --cached --quiet; then
            echo "profile.svg is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update generated profile SVG"
          git push
