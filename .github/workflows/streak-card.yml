name: Generate GitHub Streak Card

on:
    schedule:
        - cron: "37 18 * * *"

    workflow_dispatch:

permissions:
    contents: write

jobs:
    generate:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Generate streak card
              env:
                  GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
                  GITHUB_USER: ${{ github.repository_owner }}
                  OUTPUT_PATH: assets/stats/github-streak.svg
                  TRACK_SINCE: ""
              run: python scripts/generate_streak_card.py

            - name: Commit generated SVG
              uses: stefanzweifel/git-auto-commit-action@v5
              with:
                  commit_message: "chore: update github streak card"
                  commit_user_name: github-actions[bot]
                  commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
                  commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
                  file_pattern: assets/stats/*.svg
