name: Generate GitHub Streak Card

on:
    schedule:
        - cron: "37 18 * * *"

    workflow_dispatch:

    push:
        paths:
          - "scripts/generate_streak_card.py"

concurrency:
    group: github-streak-card
    cancel-in-progress: true

permissions:
    contents: write

jobs:
    generate:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Sync with remote branch
              run: |
                  git config user.name "Krexilor"
                  git config user.email "krexilor.dev@gmail.com"
                  git pull --rebase origin "${{ github.ref_name }}"

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Generate streak card
              env:
                  GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
                  GITHUB_USER: ${{ github.repository_owner }}
                  OUTPUT_PATH: assets/stats/github-streak.svg
                  TRACK_SINCE: ""
              run: python scripts/generate_streak_card.py

            - name: Commit generated SVG
              uses: stefanzweifel/git-auto-commit-action@v5
              with:
                  commit_message: "chore: update github streak card"
                  commit_user_name: Krexilor
                  commit_user_email: krexilor.dev@gmail.com
                  commit_author: krexilor <krexilor.dev@gmail.com>
                  file_pattern: assets/stats/github-streak.svg
                  push_options: --force-with-lease
