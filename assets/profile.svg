<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#191C36"/>
            <stop offset="100%" stop-color="#111321"/>
        </linearGradient>
        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#6C8CFF"/>
            <stop offset="50%" stop-color="#A78BFA"/>
            <stop offset="100%" stop-color="#67DDFB"/>
        </linearGradient>
        <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#6C8CFF"/>
            <stop offset="50%" stop-color="#343957"/>
            <stop offset="100%" stop-color="#A78BFA"/>
        </linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>
    <rect width="900" height="430" rx="18" fill="url(#bg)"/>
    <rect x="9" y="9" width="882" height="412" rx="15" fill="none" stroke="url(#border)" stroke-width="1.4">
        <animate attributeName="opacity" values="0.65;1;0.65" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="450" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#E6E9F5">Aarav Malik</text>
    <rect x="405" y="82" width="90" height="3" rx="1.5" fill="url(#accent)" filter="url(#glow)">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </rect>
    <g font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#C2C7DF">
        <text x="450" y="115" text-anchor="middle">Building efficient software and exploring the fundamentals of C++.</text><text x="450" y="138" text-anchor="middle">Interested in systems programming, backend development, and clean code.</text><text x="450" y="161" text-anchor="middle">Known as <tspan fill="#A78BFA" font-weight="700">Krexilor</tspan> online, learning one concept at a time.</text>
    </g>
    <rect x="324" y="192" width="120" height="34" rx="7" fill="#1B1F38" stroke="#6C8CFF" stroke-opacity=".7"/><text x="384" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#8FA8FF">SYSTEMS ENGINEER</text><rect x="456" y="192" width="120" height="34" rx="7" fill="#1B1F38" stroke="#A78BFA" stroke-opacity=".7"/><text x="516" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#BDA8FF">BACKEND DEVELOPER</text>
    <line x1="35" y1="244" x2="865" y2="244" stroke="#343957" stroke-width="1" stroke-linecap="round"/>
    <line x1="310" y1="264" x2="310" y2="401" stroke="#343957" stroke-width="1"/>
    <line x1="590" y1="264" x2="590" y2="401" stroke="#343957" stroke-width="1"/>
    <text x="170" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#C8D2FF">LANGUAGES</text><rect x="46" y="311" width="120" height="34" rx="7" fill="#1B1F38" stroke="#6C8CFF" stroke-opacity=".7"/><text x="106" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#C8D2FF">C++</text><rect x="174" y="311" width="120" height="34" rx="7" fill="#1B1F38" stroke="#6C8CFF" stroke-opacity=".7"/><text x="234" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#C8D2FF">JavaScript</text><text x="450" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#D7C9FF">FRAMEWORKS</text><rect x="326" y="311" width="120" height="34" rx="7" fill="#1B1F38" stroke="#A78BFA" stroke-opacity=".7"/><text x="386" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#D7C9FF">React</text><rect x="454" y="311" width="120" height="34" rx="7" fill="#1B1F38" stroke="#A78BFA" stroke-opacity=".7"/><text x="514" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#D7C9FF">Vite</text><text x="730" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#B9EFFB">TOOLS</text><rect x="606" y="311" width="120" height="34" rx="7" fill="#1B1F38" stroke="#67DDFB" stroke-opacity=".7"/><text x="666" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#B9EFFB">Git</text><rect x="734" y="311" width="120" height="34" rx="7" fill="#1B1F38" stroke="#67DDFB" stroke-opacity=".7"/><text x="794" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#B9EFFB">GitHub</text>
</svg>
